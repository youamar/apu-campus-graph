<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
.l1{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;animation:slam .6s cubic-bezier(.2,.8,.2,1) .1s both, out .25s ease-in 2.0s forwards}
.l2{position:absolute;left:0;right:0;bottom:110px;text-align:center;animation:slam .5s cubic-bezier(.2,.8,.2,1) 2.25s both}
.tab{position:absolute;width:620px;height:380px;border-radius:18px;background:#141414;border:1px solid #2f2f2f;box-shadow:0 30px 80px rgba(0,0,0,.9),0 0 60px -10px var(--c);overflow:hidden;opacity:0;animation:fly .55s cubic-bezier(.15,.9,.25,1.15) var(--d) both}
.tab .bar{height:54px;background:#1f1f1f;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid #2f2f2f}
.tab .bar i{width:12px;height:12px;border-radius:50%;background:#3a3a3a}
.tab .tt{margin-left:14px;display:flex;align-items:center;gap:12px;background:#2a2a2a;padding:8px 18px;border-radius:10px 10px 0 0;font:500 22px Roboto}
.tab .fav{width:22px;height:22px;border-radius:6px;background:var(--c)}
.tab .body{padding:28px}
.tab .ln{height:16px;border-radius:8px;background:#262626;margin:14px 0}
.tab .hl{height:44px;border-radius:10px;background:var(--c);opacity:.85;width:60%;margin-top:22px}
.tab .q{font:700 30px Roboto;color:#fff;opacity:.9}
@keyframes fly{0%{opacity:0;transform:translate(var(--fx),var(--fy)) rotate(var(--fr)) scale(.6)}100%{opacity:1;transform:rotate(var(--r)) scale(1)}}
.count{position:absolute;top:40px;right:60px;font:500 30px 'Roboto Mono';color:var(--live);letter-spacing:.1em;animation:rise .3s 2.4s both}
.shake{position:absolute;inset:0;animation:shk .45s 4.45s both}
@keyframes shk{0%,100%{transform:none}20%{transform:translate(-14px,6px)}40%{transform:translate(12px,-8px)}60%{transform:translate(-8px,4px)}80%{transform:translate(5px,-2px)}}
.pill{display:inline-block;background:rgba(0,0,0,.82);padding:18px 46px;border-radius:24px;box-shadow:0 0 80px 40px rgba(0,0,0,.85)}
</style></head><body>

 <div class="tab" style="--c:#25d366;left:170px;top:520px;--r:4deg;--fx:-900px;--fy:500px;--fr:30deg;--d:3.35s"><div class="bar"><i></i><i></i><i></i><div class="tt"><span class="fav"></span>WhatsApp · Group invite</div></div><div class="body"><div class="ln" style="width:50%;height:40px;border-radius:14px"></div><div class="ln" style="width:65%;height:40px;border-radius:14px;margin-left:30%"></div><div class="ln" style="width:40%;height:40px;border-radius:14px"></div></div></div>
